<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finnish Law Assistant</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151d; --line:#232838; --text:#e7e9ee; --muted:#9aa1b2; --dim:#6b7285; --accent:#a78bfa; --ok:#4ade80; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:820px; margin:0 auto; padding:28px 16px 140px; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:.01em; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { color:var(--text); border-color:var(--accent); }
  .turn { margin:18px 0; }
  .q { color:var(--muted); font-size:14px; margin-bottom:8px; }
  .q b { color:var(--text); font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .summary { margin:0 0 12px; }
  .claim { border-left:2px solid var(--accent); padding:6px 0 6px 12px; margin:10px 0; }
  .claim p { margin:0 0 6px; }
  .quote { color:var(--muted); font-style:italic; font-size:14px; }
  .src { font-size:12.5px; color:var(--dim); margin-top:4px; }
  .src a { color:var(--accent); text-decoration:none; }
  .ok { color:var(--ok); font-weight:600; }
  .refuse { color:var(--warn); }
  .meta { font-size:12px; color:var(--dim); margin-top:12px; display:flex; gap:14px; flex-wrap:wrap; }
  details { margin-top:10px; font-size:13px; color:var(--dim); }
  form { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(transparent, var(--bg) 30%); padding:24px 16px 18px; }
  .bar { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  input[type=text] { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:12px 14px; font-size:15px; min-width:0; }
  input[type=text]:focus { outline:none; border-color:var(--accent); }
  select, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:0 12px; font-size:14px; }
  button { background:var(--accent); color:#120b25; border:0; font-weight:700; padding:0 18px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .note { font-size:12px; color:var(--dim); text-align:center; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>Finnish Law Assistant</h1>
  <p class="sub">Ask in English. Answers come only from current Finnish statutes on Finlex, and every sentence shown has a quote that was checked against the law.</p>
  <div class="chips" id="chips"></div>
  <div id="log"></div>
</main>
<form id="f">
  <div class="bar">
    <input type="text" id="q" placeholder="e.g. How much notice must my employer give me?" autocomplete="off" required minlength="3" maxlength="1000">
    <select id="p" title="Pipeline"><option value="rag">RAG</option><option value="agent">Agent</option></select>
    <button id="b">Ask</button>
  </div>
  <div class="note">Not legal advice. Check the full section on Finlex before relying on it.</div>
</form>
<script>
const examples = ["How long can the trial period of my job be?", "When does my landlord have to return my rental deposit?",
  "How much extra must I be paid for overtime?", "Can my employer read my work email while I'm on holiday?",
  "What are the requirements for a permanent residence permit?"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
for (const e of examples) { const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = e; c.onclick = () => { $("q").value = e; ask(); }; $("chips").append(c); }
async function ask() {
  const question = $("q").value.trim(); if (question.length < 3) return;
  const turn = document.createElement("div"); turn.className = "turn";
  turn.innerHTML = `<div class="q">You asked: <b>${esc(question)}</b></div><div class="card">Searching the law and checking quotes…</div>`;
  $("log").prepend(turn); $("b").disabled = true;
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question, pipeline: $("p").value})});
    const a = await r.json();
    if (!r.ok) throw new Error(a.detail ? JSON.stringify(a.detail) : r.statusText);
    let html = a.status === "answered"
      ? `<p class="summary">${esc(a.summary || "Here is what the law says:")}</p>` + a.claims.map((c) => `
          <div class="claim"><p>${esc(c.text)} <span class="ok" title="Quote found in the section and judged to support this sentence">✓</span></p>
          <div class="quote">“${esc(c.quote_fi)}”</div>
          <div class="src">${esc(c.label)}, ${esc(c.heading)} · <a href="${esc(c.url)}" target="_blank" rel="noopener">Finlex</a></div></div>`).join("")
      : `<p class="refuse">${esc(a.message)}</p>`;
    if (a.removed.length) html += `<details><summary>${a.removed.length} sentence(s) removed by the checks</summary>${a.removed.map((x) => `<div>· ${esc(x.text)} <i>(${esc(x.reason)})</i></div>`).join("")}</details>`;
    html += `<div class="meta"><span>${esc(a.pipeline)} · ${esc(a.model)}</span><span>${a.seconds}s</span><span>$${a.cost_usd.toFixed(4)}</span></div>`;
    turn.querySelector(".card").innerHTML = html;
  } catch (e) { turn.querySelector(".card").innerHTML = `<p class="refuse">Error: ${esc(e.message)}</p>`; }
  $("b").disabled = false;
}
$("f").onsubmit = (e) => { e.preventDefault(); ask(); };
</script>
</body>
</html>
